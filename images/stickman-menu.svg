<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#bf00ff"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg1)"/>
  <!-- Grid pattern -->
  <g opacity="0.15" stroke="#00f5ff" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="213" y1="0" x2="213" y2="720"/>
    <line x1="426" y1="0" x2="426" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="853" y1="0" x2="853" y2="720"/>
    <line x1="1066" y1="0" x2="1066" y2="720"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="200" cy="200" r="200" fill="url(#glow1)"/>
  <circle cx="1080" cy="520" r="180" fill="#bf00ff" opacity="0.15" filter="url(#blur1)"/>
  <!-- Title -->
  <text x="640" y="200" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#neon1)" filter="url(#blur1)" opacity="0.6">KNIFE SURVIVAL</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="none" stroke="url(#neon1)" stroke-width="2">KNIFE SURVIVAL</text>
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#a78bfa">火柴人飞刀生存</text>
  <!-- Stickman character -->
  <g transform="translate(640, 420)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="60" fill="#00f5ff" opacity="0.2" filter="url(#blur1)"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="18" fill="none" stroke="#00f5ff" stroke-width="4"/>
    <!-- Body -->
    <line x1="0" y1="-17" x2="0" y2="25" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="0" y1="-5" x2="-30" y2="10" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="30" y2="10" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="0" y1="25" x2="-20" y2="55" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="25" x2="20" y2="55" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Orbiting knives -->
    <g>
      <g transform="rotate(0)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#ff006e" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#ff006e"/>
      </g>
      <g transform="rotate(45)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#00f5ff" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#00f5ff"/>
      </g>
      <g transform="rotate(90)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#bf00ff" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#bf00ff"/>
      </g>
      <g transform="rotate(135)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#ff006e" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#ff006e"/>
      </g>
      <g transform="rotate(180)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#00f5ff" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#00f5ff"/>
      </g>
      <g transform="rotate(225)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#bf00ff" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#bf00ff"/>
      </g>
      <g transform="rotate(270)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#ff006e" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#ff006e"/>
      </g>
      <g transform="rotate(315)">
        <line x1="0" y1="-85" x2="0" y2="-105" stroke="#00f5ff" stroke-width="3"/>
        <polygon points="0,-105 -5,-95 5,-95" fill="#00f5ff"/>
      </g>
    </g>
  </g>
  <!-- Menu buttons -->
  <g transform="translate(640, 600)">
    <rect x="-100" y="-25" width="200" height="50" rx="8" fill="none" stroke="url(#neon1)" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#00f5ff">开始游戏</text>
  </g>
  <!-- HUD top -->
  <rect x="20" y="20" width="200" height="40" rx="6" fill="#000" opacity="0.5" stroke="#00f5ff" stroke-width="1"/>
  <text x="120" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#00f5ff">分数: 0</text>
  <rect x="1060" y="20" width="200" height="40" rx="6" fill="#000" opacity="0.5" stroke="#ff006e" stroke-width="1"/>
  <text x="1160" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ff006e">时间: 180s</text>
</svg>
