<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bg3" cx="40%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <filter id="slashGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg3)"/>
  <!-- Blood splatter effects -->
  <g opacity="0.3">
    <circle cx="450" cy="350" r="15" fill="#ff006e"/>
    <circle cx="870" cy="420" r="12" fill="#ff006e"/>
    <circle cx="700" cy="300" r="8" fill="#ff006e"/>
    <circle cx="550" cy="480" r="10" fill="#ff006e"/>
  </g>
  <!-- Player (left side) -->
  <g transform="translate(400, 380)">
    <circle cx="0" cy="0" r="80" fill="#00f5ff" opacity="0.08" filter="url(#strongGlow)"/>
    <circle cx="0" cy="-28" r="15" fill="none" stroke="#00f5ff" stroke-width="4"/>
    <line x1="0" y1="-13" x2="0" y2="20" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-2" x2="-24" y2="6" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-2" x2="24" y2="6" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="-14" y2="44" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="14" y2="44" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Orbiting knives with motion trails -->
    <g>
      <g transform="rotate(-30)"><line x1="0" y1="-75" x2="0" y2="-95" stroke="#00f5ff" stroke-width="3" filter="url(#slashGlow)"/><polygon points="0,-95 -5,-85 5,-85" fill="#00f5ff"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-75" x2="0" y2="-95" stroke="#bf00ff" stroke-width="3" filter="url(#slashGlow)"/><polygon points="0,-95 -5,-85 5,-85" fill="#bf00ff"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-75" x2="0" y2="-95" stroke="#ff006e" stroke-width="3" filter="url(#slashGlow)"/><polygon points="0,-95 -5,-85 5,-85" fill="#ff006e"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-75" x2="0" y2="-95" stroke="#00f5ff" stroke-width="3" filter="url(#slashGlow)"/><polygon points="0,-95 -5,-85 5,-85" fill="#00f5ff"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-75" x2="0" y2="-95" stroke="#bf00ff" stroke-width="3" filter="url(#slashGlow)"/><polygon points="0,-95 -5,-85 5,-85" fill="#bf00ff"/></g>
    </g>
  </g>
  <!-- Slash effects towards enemies -->
  <g opacity="0.8">
    <path d="M 460 360 Q 560 300 680 340" stroke="#00f5ff" stroke-width="3" fill="none" filter="url(#slashGlow)"/>
    <path d="M 460 380 Q 600 420 720 380" stroke="#bf00ff" stroke-width="3" fill="none" filter="url(#slashGlow)"/>
    <path d="M 450 400 Q 580 460 700 430" stroke="#ff006e" stroke-width="2" fill="none" filter="url(#slashGlow)"/>
  </g>
  <!-- Enemy group (right side, being attacked) -->
  <g transform="translate(800, 320)">
    <circle cx="0" cy="0" r="35" fill="#ff4444" opacity="0.15"/>
    <circle cx="0" cy="-18" r="12" fill="none" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="-6" x2="0" y2="18" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="2" x2="-16" y2="10" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="2" x2="16" y2="10" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="18" x2="-12" y2="32" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="18" x2="12" y2="32" stroke="#ff4444" stroke-width="3"/>
    <!-- Damage flash -->
    <circle cx="0" cy="0" r="30" fill="#fff" opacity="0.4"/>
    <!-- Damage number -->
    <text x="10" y="-30" font-family="Arial Black" font-size="28" fill="#ffdd00" font-weight="900">-15</text>
    <!-- Health bar low -->
    <rect x="-22" y="-40" width="44" height="5" fill="#333"/>
    <rect x="-22" y="-40" width="10" height="5" fill="#ff4444"/>
  </g>
  <!-- Enemy 2 being hit -->
  <g transform="translate(920, 440)">
    <circle cx="0" cy="-18" r="12" fill="none" stroke="#ff8800" stroke-width="3"/>
    <line x1="0" y1="-6" x2="0" y2="18" stroke="#ff8800" stroke-width="3"/>
    <line x1="0" y1="2" x2="-16" y2="10" stroke="#ff8800" stroke-width="3"/>
    <line x1="0" y1="2" x2="16" y2="10" stroke="#ff8800" stroke-width="3"/>
    <line x1="0" y1="18" x2="-12" y2="32" stroke="#ff8800" stroke-width="3"/>
    <line x1="0" y1="18" x2="12" y2="32" stroke="#ff8800" stroke-width="3"/>
    <text x="10" y="-30" font-family="Arial Black" font-size="24" fill="#ffdd00" font-weight="900">-15</text>
    <rect x="-22" y="-40" width="44" height="5" fill="#333"/>
    <rect x="-22" y="-40" width="22" height="5" fill="#ff8800"/>
  </g>
  <!-- Enemy 3 (approaching from top) -->
  <g transform="translate(640, 180)">
    <circle cx="0" cy="-15" r="10" fill="none" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="-5" x2="0" y2="15" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="0" x2="-12" y2="7" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="0" x2="12" y2="7" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="15" x2="-9" y2="26" stroke="#ff4444" stroke-width="3"/>
    <line x1="0" y1="15" x2="9" y2="26" stroke="#ff4444" stroke-width="3"/>
    <rect x="-20" y="-32" width="40" height="4" fill="#333"/>
    <rect x="-20" y="-32" width="30" height="4" fill="#ff4444"/>
  </g>
  <!-- HUD -->
  <rect x="30" y="25" width="180" height="44" rx="8" fill="rgba(0,0,0,0.6)" stroke="#00f5ff" stroke-width="1"/>
  <text x="120" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#00f5ff" font-weight="bold">分数: 480</text>
  <rect x="540" y="25" width="200" height="44" rx="8" fill="rgba(0,0,0,0.6)" stroke="#ff006e" stroke-width="1"/>
  <text x="640" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ff006e" font-weight="bold">⏱ 01:50</text>
  <rect x="1070" y="25" width="180" height="44" rx="8" fill="rgba(0,0,0,0.6)" stroke="#22c55e" stroke-width="1"/>
  <text x="1160" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#22c55e" font-weight="bold">❤ 72 / 100</text>
  <!-- Combo indicator -->
  <rect x="30" y="640" width="140" height="50" rx="8" fill="rgba(0,0,0,0.7)" stroke="#ffdd00" stroke-width="1"/>
  <text x="100" y="672" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#ffdd00" font-weight="900">COMBO x5</text>
</svg>
