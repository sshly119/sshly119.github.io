<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="level1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="level2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="level3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="upgradeGlow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg5)"/>
  <!-- Particle effects -->
  <g opacity="0.5">
    <circle cx="200" cy="360" r="3" fill="#ffdd00"/>
    <circle cx="250" cy="300" r="2" fill="#ffdd00"/>
    <circle cx="220" cy="420" r="2" fill="#ffdd00"/>
    <circle cx="180" cy="280" r="2" fill="#ffdd00"/>
    <circle cx="1080" cy="360" r="3" fill="#00f5ff"/>
    <circle cx="1030" cy="300" r="2" fill="#00f5ff"/>
    <circle cx="1060" cy="420" r="2" fill="#00f5ff"/>
  </g>
  <!-- Player in center with upgrade glow -->
  <g transform="translate(640, 400)">
    <circle cx="0" cy="0" r="100" fill="#ffdd00" opacity="0.1" filter="url(#upgradeGlow)"/>
    <circle cx="0" cy="-25" r="16" fill="none" stroke="#00f5ff" stroke-width="4"/>
    <line x1="0" y1="-9" x2="0" y2="18" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-22" y2="8" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="8" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="-14" y2="38" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="14" y2="38" stroke="#00f5ff" stroke-width="4" stroke-linecap="round"/>
    <!-- Many orbiting knives showing level 3 -->
    <g>
      <g transform="rotate(0)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#f59e0b" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#f59e0b"/></g>
      <g transform="rotate(45)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#ef4444" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#ef4444"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#ec4899" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#ec4899"/></g>
      <g transform="rotate(135)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#f59e0b" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#f59e0b"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#ef4444" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#ef4444"/></g>
      <g transform="rotate(225)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#ec4899" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#ec4899"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#f59e0b" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#f59e0b"/></g>
      <g transform="rotate(315)"><line x1="0" y1="-55" x2="0" y2="-75" stroke="#ef4444" stroke-width="3" filter="url(#upgradeGlow)"/><polygon points="0,-75 -4,-67 4,-67" fill="#ef4444"/></g>
    </g>
  </g>
  <!-- Upgrade panel -->
  <rect x="440" y="60" width="400" height="100" rx="12" fill="rgba(0,0,0,0.7)" stroke="#ffdd00" stroke-width="2"/>
  <text x="640" y="100" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" fill="#ffdd00" font-weight="900">🎉 升级到 三级! 🎉</text>
  <text x="640" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff">飞刀数量: 16 → 解锁重型敌人</text>
  <!-- Level progress bar -->
  <rect x="340" y="180" width="600" height="24" rx="12" fill="rgba(0,0,0,0.6)" stroke="#444" stroke-width="1"/>
  <rect x="340" y="180" width="600" height="24" rx="12" fill="url(#level3)"/>
  <text x="640" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff" font-weight="bold">LEVEL 3 / 3 (已满级)</text>
  <!-- Level markers -->
  <g transform="translate(340, 215)">
    <circle cx="0" cy="0" r="8" fill="#22c55e"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#22c55e">1级<br/>8飞刀</text>
  </g>
  <g transform="translate(640, 215)">
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6">2级<br/>12飞刀</text>
  </g>
  <g transform="translate(940, 215)">
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b">3级<br/>16飞刀</text>
  </g>
  <!-- Knife pickup items floating -->
  <g transform="translate(200, 360)">
    <circle cx="0" cy="0" r="20" fill="#00f5ff" opacity="0.2" filter="url(#upgradeGlow)"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#00f5ff" stroke-width="4"/>
    <polygon points="0,-18 -6,-8 6,-8" fill="#00f5ff"/>
    <polygon points="0,18 -6,8 6,8" fill="#00f5ff"/>
  </g>
  <g transform="translate(1080, 360)">
    <circle cx="0" cy="0" r="20" fill="#bf00ff" opacity="0.2" filter="url(#upgradeGlow)"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#bf00ff" stroke-width="4"/>
    <polygon points="0,-18 -6,-8 6,-8" fill="#bf00ff"/>
    <polygon points="0,18 -6,8 6,8" fill="#bf00ff"/>
  </g>
  <!-- HUD -->
  <rect x="30" y="620" width="200" height="50" rx="8" fill="rgba(0,0,0,0.6)" stroke="#bf00ff" stroke-width="1"/>
  <text x="130" y="652" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#bf00ff" font-weight="bold">🗡 飞刀: 16</text>
  <rect x="1050" y="620" width="200" height="50" rx="8" fill="rgba(0,0,0,0.6)" stroke="#f59e0b" stroke-width="1"/>
  <text x="1150" y="652" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f59e0b" font-weight="bold">等级: MAX</text>
</svg>
